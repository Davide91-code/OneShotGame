spring.application.name=backend

# Connessione MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/game?useSSL=false&serverTimezone=Europe/Rome&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Esegue eventuali script SQL (es. data.sql) dopo la creazione delle tabelle da parte delle Entity
spring.jpa.defer-datasource-initialization=true